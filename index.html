<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advent Calendar Demo</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --ink: #1e293b;
        --muted: #64748b;
        --accent: #3b82f6;
        --locked: #e2e8f0;
        --opened: #dbeafe;
        --border: #cbd5e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px 16px 60px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
      }

      .sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 2px;
      }

      .sim-box {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 0.85rem;
      }

      .sim-box select,
      .sim-box button {
        font: inherit;
        font-size: 0.82rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        padding: 4px 8px;
        background: #fff;
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 10px;
      }

      .day-btn {
        aspect-ratio: 1 / 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition:
          transform 0.12s ease,
          background 0.15s ease,
          border-color 0.15s ease;
      }

      .day-btn:hover:not(.is-locked) {
        transform: translateY(-2px);
        border-color: var(--accent);
      }

      .day-btn.is-opened {
        background: var(--opened);
        border-color: #93c5fd;
      }

      .day-btn.is-target {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .day-btn.is-locked {
        background: var(--locked);
        color: #64748b;
      }

      .day-num {
        font-size: 1.25rem;
        font-weight: 700;
      }

      .day-status {
        font-size: 0.7rem;
        color: var(--muted);
      }

      dialog {
        border: none;
        border-radius: 16px;
        padding: 0;
        max-width: 440px;
        width: calc(100% - 32px);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      }

      dialog::backdrop {
        background: rgba(15, 23, 42, 0.45);
      }

      .modal-body {
        padding: 24px;
      }

      .modal-date {
        font-size: 0.85rem;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 6px;
      }

      .modal-title {
        margin: 0 0 12px;
        font-size: 1.15rem;
      }

      .modal-msg {
        margin: 0 0 20px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .close-btn {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .demo-note {
        margin-top: 24px;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1 id="title">アドベントカレンダー</h1>
          <div class="sub" id="subtitle"></div>
        </div>

        <!-- デモ用：擬似日付の切り替え -->
        <div class="sim-box">
          <label for="simDaySelect">擬似日付:</label>
          <select id="simDaySelect"></select>
          <button type="button" id="resetSimBtn">今日に戻す</button>
        </div>
      </header>

      <div class="grid" id="grid"></div>

      <p class="demo-note">
        ※
        公開デモ版：アクセスした月の日数に合わせて自動生成されます。上部の「擬似日付」から未来日も試せます。
      </p>
    </div>

    <dialog id="modal">
      <div class="modal-body">
        <div class="modal-date" id="mDate"></div>
        <h2 class="modal-title" id="mTitle"></h2>
        <p class="modal-msg" id="mMsg"></p>
        <button class="close-btn" id="mClose">閉じる</button>
      </div>
    </dialog>

    <script>
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const realToday = now.getDate();
      const daysInMonth = new Date(year, month, 0).getDate();

      const STORAGE_KEY = `advent_demo_${year}_${month}`;
      const openedSet = new Set(
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"),
      );

      // ここを増やせばバリエーションが増えます（最大31個など）
      const SAMPLE_LINES = [
        "1日目。カレンダーのマスを開けるだけのアプリです。気楽にどうぞ。",
        "【豆知識】くしゃみの初速は時速約300kmらしいです。今日もほどほどに。",
        "温かい飲み物でも淹れて、ひと息つく時間を作ってみてください。",
        "特に深い意味のないメッセージの日もありますが、仕様です。",
        "今日のラッキーアイテムは「お気に入りのマグカップ」ということにしておきます。",
        "日付マスはアクセスした月の日数（28〜31日）に合わせて自動で増減します。",
        "突然ですが、最近よく食べているおやつはありますか？（答えなくて大丈夫です）",
        "特に急ぎの用事がない日は、少し遠回りして帰るのも悪くないですね。",
        "【今日の運勢】中吉くらいにしておきます。ちょうどいい平熱の運気です。",
        "10日目。ここまで開けてくれていたら、作った側としては地味に嬉しいです。",
        "空を見上げたら雲の形が面白かった、くらいの小さな発見があるといいですね。",
        "このメッセージはAIに作ってもらいました。という、この文を書いているのは制作者です。",
        "【豆知識】ラッコは寝るとき、流されないように海藻を体に巻きつけるそうです。",
        "特に生産性のない時間というのも、人間には必要な気がします。",
        "月の折り返し付近。まだ未読のマスがあれば、気が向いたときにどうぞ。",
        "【余談】制作者は二十代ですが、筒美京平の曲経由でC-C-Bにハマって最近よく聴いています。あの音が好きです。",
        "今日のミッション：美味しいものをひとつ食べる。クリア報酬は満足感です。",
        "なんとなく眠い日は、無理に頑張らず早めに布団に入るのが正解です。",
        "天気予報が外れても、傘を持って出た日ほど雨が降らなくても、まあそんなものです。",
        "20日目。一日の終わりに「今日も一日終わったな」と思えれば十分です。",
        "本屋やCDショップをぶらぶら歩く時間は、用事がなくても落ち着きます。",
        "ここまで開けてきた記念に「継続力賞」を授与します（※賞品はありません）。",
        "冷蔵庫の中にちょっと良い飲み物が入っていると、帰宅時のテンションが少し上がります。",
        "カレンダーのマスを埋めていく感覚は、ちょっとした日課に似ています。",
        "音楽を聴きながらぼーっとする時間は、意外と大事なメンテナンスかもしれません。",
        "もうすぐ月末ですが、今月やり残したことがあっても来月に回せば大丈夫です。",
        "【豆知識】人間の脳は、退屈しているときのほうが意外と変なアイデアを思いつくらしいです。",
        "28日目。このアプリも、誰かの暇つぶしに1分くらい使われれば本望です。",
        "月末が近づいてきました。深呼吸ひとつして、肩の力を抜いていきましょう。",
        "30日目。長い月も短い月も、気がつけばあっという間に過ぎていきます。",
        "31日目（大の月限定枠）。ここまで開けたあなたは相当なマメさです。お疲れさまでした！",
      ];
      let activeDay = realToday;

      const simSelect = document.getElementById("simDaySelect");
      for (let d = 1; d <= daysInMonth; d++) {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = `${month}/${d}${d === realToday ? "（今日）" : ""}`;
        if (d === activeDay) opt.selected = true;
        simSelect.appendChild(opt);
      }

      function getEntry(day) {
        return {
          title: `${month}月${day}日のひとこと`,
          msg: SAMPLE_LINES[(day - 1) % SAMPLE_LINES.length],
        };
      }

      const grid = document.getElementById("grid");
      const modal = document.getElementById("modal");

      function renderGrid() {
        document.getElementById("title").textContent =
          `${year}年${month}月 カレンダー`;
        document.getElementById("subtitle").textContent =
          `全${daysInMonth}日 / 判定基準日：${month}/${activeDay}` +
          (activeDay !== realToday ? `（実際は${month}/${realToday}）` : "");

        grid.innerHTML = "";

        for (let d = 1; d <= daysInMonth; d++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "day-btn";

          const isFuture = d > activeDay;
          const isOpened = openedSet.has(d);

          if (d === activeDay) btn.classList.add("is-target");
          if (isFuture) btn.classList.add("is-locked");
          if (isOpened) btn.classList.add("is-opened");

          const statusText = isFuture ? "未解放" : isOpened ? "開封済" : "未読";
          btn.innerHTML = `<span class="day-num">${d}</span><span class="day-status">${statusText}</span>`;

          btn.addEventListener("click", () => {
            if (isFuture) {
              document.getElementById("mDate").textContent = `${month}/${d}`;
              document.getElementById("mTitle").textContent =
                "まだ開けられません";
              document.getElementById("mMsg").textContent =
                `${month}月${d}日以降に設定すると確認できます（デモでは上部の「擬似日付」を変更してみてください）。`;
              modal.showModal();
              return;
            }

            openedSet.add(d);
            localStorage.setItem(STORAGE_KEY, JSON.stringify([...openedSet]));
            btn.classList.add("is-opened");
            btn.querySelector(".day-status").textContent = "開封済";

            const entry = getEntry(d);
            document.getElementById("mDate").textContent = `${month}/${d}`;
            document.getElementById("mTitle").textContent = entry.title;
            document.getElementById("mMsg").textContent = entry.msg;
            modal.showModal();
          });

          grid.appendChild(btn);
        }
      }

      simSelect.addEventListener("change", (e) => {
        activeDay = Number(e.target.value);
        renderGrid();
      });

      document.getElementById("resetSimBtn").addEventListener("click", () => {
        activeDay = realToday;
        simSelect.value = String(realToday);
        renderGrid();
      });

      document
        .getElementById("mClose")
        .addEventListener("click", () => modal.close());
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.close();
      });

      renderGrid();
    </script>
  </body>
</html>
